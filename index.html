<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Song Battle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<style>
  html, body { background: #0A0812; margin: 0; padding: 0; }
  #root { margin: 0 auto; padding: 16px; }
  .disp { font-family: 'Anton', sans-serif; letter-spacing: 0.02em; }
  .glowbtn { transition: all .15s ease; }
  .glowbtn:active { transform: scale(0.96); }
  .vote-timer { transition: font-size 0.25s ease, color 0.25s ease; }
  .vote-timer.urgent { animation: urgentPulse 0.55s ease-in-out infinite; color: #FF3D6E; }
  @keyframes urgentPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.4); } }
</style>
</head>
<body>
<div id="root"></div>
<script src="app.js"></script>
</body>
</html>
